<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yedu ❤️ My Valentine</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: linear-gradient(135deg,#ff9ecf,#ff4d88);
  text-align:center;
  color:white;
  overflow:hidden;
}

h1{
  margin-top:60px;
  font-size:2.5rem;
}

.card{
  background: rgba(255,255,255,0.15);
  margin:20px auto;
  padding:25px;
  border-radius:20px;
  width:85%;
  max-width:400px;
  backdrop-filter: blur(10px);
}

button{
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
  font-weight:bold;
}

#yesBtn{
  background:white;
  color:#ff4d88;
}

#noBtn{
  background:#ff1a66;
  color:white;
  position:absolute;
}

.heart{
  position:fixed;
  font-size:20px;
  animation: float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<h1>Happy Valentine's Day Yedu 💖</h1>

<div class="card">
<p>
Yedu, tum meri life ki sabse cute kahani ho 🥺💕  
Tumhari smile meri duniya roshan kar deti hai.  
Aaj ek important sawaal hai...
</p>

<h3>Kya tum meri Forever Valentine banogi? 💍</h3>

<button id="yesBtn" onclick="yesLove()">Yes 💖</button>
<button id="noBtn">No 😜</button>

<p id="result" style="margin-top:15px;"></p>
</div>

<footer style="position:fixed;bottom:10px;width:100%;font-size:14px;">
Made with endless love for Yedu ❤️
</footer>

<script>
function yesLove(){
  document.getElementById("result").innerHTML=
  "Yayyyyy 😍💖<br>Ab tum officially meri ho! 💍💕<br>I love you sooo much Yedu ❤️";
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.color="white";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,500);
</script>

</body>
</html>
